# NanoASR configuration.
#
# Every value here is a default: the server starts with no config file at all.
# Precedence is flags > NANOASR_* env > this file > computed defaults.
# Sizing knobs left at 0 are derived from CPU count and RAM (SPEC §12.3).

server:
  addr: "127.0.0.1:8080"
  read_header_timeout: 10s
  max_upload_bytes: 104857600   # 100 MB
  shutdown_grace: 30s

auth:
  # "open" is permitted only when addr binds a loopback address.
  mode: open
  keys: []                      # or NANOASR_AUTH_KEYS=key1,key2

api:
  dialects: [openai, native]

ui:
  enabled: true
  path: /ui

audio:
  # Leave empty to run without ffmpeg: WAV/PCM still works, everything else
  # is answered with 415 instead of failing at startup.
  ffmpeg_path: ffmpeg
  ffmpeg_timeout: 120s
  max_duration: 30m
  target_sample_rate: 16000
  channel_mode: downmix         # downmix | first | split
  # split decodes every channel in full, so memory scales with the channel
  # count. Two is a telephony A/B leg pair; more is refused rather than
  # decoded into an OOM.
  max_split_channels: 2
  max_decoded_bytes: 0          # 0 → max_duration x rate x 4 x max_split_channels

vad:
  enabled: true
  model: silero-vad-v5
  threshold: 0.5
  min_silence_ms: 300
  min_speech_ms: 250
  # Without an upper bound a long monologue becomes one enormous segment.
  max_speech_sec: 20

asr:
  models_dir: ./.models
  default_model: gigaam-v3-ctc-punct-ru
  max_resident_models: 0        # 0 → auto
  max_model_rss_mb: 0           # 0 → auto
  inference_slots: 0            # 0 → GOMAXPROCS
  num_threads: 0                # 0 → auto, per model instance
  idle_ttl: 15m
  acquire_timeout: 30s
  batch:
    max_size: 8
    max_seconds: 60
  # hotwords, decoding_method and max_active_paths cannot be changed on a
  # loaded recogniser, so honouring them per request means a second resident
  # copy of the model. 0 keeps the model's own settings and says so in a
  # warning; raising this trades memory for per-request control.
  variants:
    max: 0
    allow_hotwords: false

registry:
  allow_download: true
  catalog_url: ""               # empty → built-in catalog
  mirrors: []
  download_concurrency: 2
  strict_license: false         # true → refuse non-commercial weights

jobs:
  queue_size: 100
  max_concurrent: 0             # 0 → auto
  # A queued job owns its audio until it finishes, so the queue is bounded by
  # bytes as well as by item count. Must be at least max_upload_bytes.
  max_queued_bytes: 4294967296  # 4 GiB
  max_processing_time: 30m
  history_ttl: 720h             # 30 days of metadata and transcripts
  # Signs webhook deliveries as X-NanoASR-Signature: sha256=<hmac>. Empty
  # means unsigned, and the server says so at startup.
  webhook_secret: ""
  # Permits webhook_url pointing at loopback and private ranges. Only for a
  # receiver on your own machine; refused unless addr is loopback too.
  webhook_allow_private: true

postproc:
  punctuation:
    enabled: false
    model: ""                   # a catalog model of kind punctuation
  # Inverse text normalisation needs no model: the rules are built in. Left off
  # by default because it is a request option (SPEC decision 14), not because
  # anything is missing.
  itn:
    enabled: false
    locale: ru
  hotwords:
    enabled: false              # requires asr.variants.max > 0
    default_score: 1.5

diarization:
  enabled: true
  segmentation_model: pyannote-segmentation-3
  embedding_model: campplus-sv-zh-en
  clustering:
    num_clusters: 0             # 0 → cluster by threshold
    threshold: 0.5
  # How short a turn may be before it is dropped, and how short a gap may be
  # before the turns around it are joined.
  min_duration_on: 0.3
  min_duration_off: 0.5

storage:
  db_path: ./.nanoasr.db
  # Empty picks a nanoasr-spool directory under the system temp dir. Queued
  # audio lives here and nowhere else, and only until its job finishes.
  temp_dir: ""

log:
  level: debug
  format: text
