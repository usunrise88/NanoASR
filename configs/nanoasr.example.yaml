# NanoASR configuration.
#
# Every value here is a default: the server starts with no config file at all.
# Precedence is flags > NANOASR_* env > this file > computed defaults.
# Sizing knobs left at 0 are derived from CPU count and RAM (SPEC §12.3).

server:
  addr: ":8080"
  read_header_timeout: 10s
  max_upload_bytes: 104857600   # 100 MB
  shutdown_grace: 30s

auth:
  # "open" is permitted only when addr binds a loopback address. In apikey
  # mode at least one key is required: a server with none answers 401 to
  # everything, so it refuses to start rather than pretend to be configured.
  mode: apikey
  keys: []
  # A key may be a bare string, or a mapping when it needs a name or the right
  # to administer models. "sha256:<hex>" keeps the plaintext out of this file.
  #
  # keys:
  #   - sk-a-long-random-string-at-least-16-chars
  #   - name: ci
  #     key: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  #     admin: true
  #
  # Or supply them from the environment: NANOASR_AUTH_KEYS=key1,key2

api:
  dialects: [openai, native]
  cors:
    enabled: false
    origins: []

ui:
  enabled: true
  path: /ui
  require_auth: true

audio:
  # Leave empty to run without ffmpeg: WAV/PCM still works, everything else
  # is answered with 415 instead of failing at startup.
  ffmpeg_path: ffmpeg
  ffmpeg_timeout: 120s
  max_duration: 30m
  target_sample_rate: 16000
  channel_mode: downmix         # downmix | first | split
  denoise: false

vad:
  enabled: true
  model: silero-vad-v5
  threshold: 0.5
  min_silence_ms: 300
  min_speech_ms: 250
  # Without an upper bound a long monologue becomes one enormous segment.
  max_speech_sec: 20

asr:
  models_dir: /var/lib/nanoasr/models
  default_model: ""
  max_resident_models: 0        # 0 → auto
  max_model_rss_mb: 0           # 0 → auto
  inference_slots: 0            # 0 → GOMAXPROCS
  num_threads: 0                # 0 → auto, per model instance
  idle_ttl: 15m
  acquire_timeout: 30s
  batch:
    max_size: 8
    max_seconds: 60

registry:
  allow_download: true
  catalog_url: ""               # empty → built-in catalog
  mirrors: []
  download_concurrency: 2
  strict_license: false         # true → refuse non-commercial weights

jobs:
  queue_size: 100
  max_concurrent: 0             # 0 → auto
  max_processing_time: 30m
  history_ttl: 720h             # 30 days of metadata and transcripts

postproc:
  punctuation:
    enabled: false
    model: ""
  itn:
    enabled: false
    locale: ru

diarization:
  enabled: false
  segmentation_model: ""
  embedding_model: ""
  clustering:
    num_clusters: 0             # 0 → cluster by threshold
    threshold: 0.5

storage:
  db_path: /var/lib/nanoasr/nanoasr.db
  temp_dir: ""
  # 0 means uploaded audio never outlives the active job. The UI player uses
  # the local file in the browser, so nothing here is needed for playback.
  keep_audio_ttl: 0

log:
  level: info
  format: json
