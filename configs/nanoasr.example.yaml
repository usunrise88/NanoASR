# NanoASR configuration.
#
# Every value here is a default: the server starts with no config file at all.
# Precedence is flags > NANOASR_* env > this file > computed defaults.
# Sizing knobs left at 0 are derived from CPU count and RAM (SPEC §12.3).

server:
  addr: ":8080"
  read_header_timeout: 10s
  max_upload_bytes: 104857600   # 100 MB
  shutdown_grace: 30s

auth:
  # "open" is permitted only when addr binds a loopback address. In apikey
  # mode at least one key is required: a server with none answers 401 to
  # everything, so it refuses to start rather than pretend to be configured.
  mode: apikey
  keys: []
  # A key may be a bare string, or a mapping when it needs a name or the right
  # to administer models. "sha256:<hex>" keeps the plaintext out of this file.
  #
  # keys:
  #   - sk-a-long-random-string-at-least-16-chars
  #   - name: ci
  #     key: sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  #     admin: true
  #   - name: partner
  #     key: sk-another-long-random-string
  #     rps: 10          # requests per second for this key; 0 or absent = no limit
  #   - name: ui
  #     key: sk-the-key-the-test-ui-uses
  #     priority: interactive   # this key's jobs overtake the batch backlog
  #
  # priority is a property of the key, not of the request: a request parameter
  # would let every client call itself urgent, which is the same as having no
  # priorities at all. Default is batch.
  #
  # Or supply them from the environment: NANOASR_AUTH_KEYS=key1,key2

api:
  dialects: [openai, native]

ui:
  enabled: true
  path: /ui
  # There is no require_auth: whether the UI needs a key is not a UI setting.
  # The SPA finds out from the first 401 the API gives it.

audio:
  # Leave empty to run without ffmpeg: WAV/PCM still works, everything else
  # is answered with 415 instead of failing at startup.
  ffmpeg_path: ffmpeg
  ffmpeg_timeout: 120s
  max_duration: 30m
  target_sample_rate: 16000
  channel_mode: downmix         # downmix | first | split
  # split decodes every channel in full, so memory scales with the channel
  # count. Two is a telephony A/B leg pair; more is refused rather than
  # decoded into an OOM.
  max_split_channels: 2
  max_decoded_bytes: 0          # 0 → max_duration x rate x 4 x max_split_channels

vad:
  enabled: true
  model: silero-vad-v5
  threshold: 0.5
  min_silence_ms: 300
  min_speech_ms: 250
  # Without an upper bound a long monologue becomes one enormous segment.
  max_speech_sec: 20

asr:
  models_dir: /var/lib/nanoasr/models
  default_model: ""
  max_resident_models: 0        # 0 → auto
  max_model_rss_mb: 0           # 0 → auto
  inference_slots: 0            # 0 → GOMAXPROCS
  num_threads: 0                # 0 → auto, per model instance
  idle_ttl: 15m
  acquire_timeout: 30s
  batch:
    max_size: 8
    max_seconds: 60
  # hotwords, decoding_method and max_active_paths cannot be changed on a
  # loaded recogniser, so honouring them per request means a second resident
  # copy of the model. 0 keeps the model's own settings and says so in a
  # warning; raising this trades memory for per-request control.
  variants:
    max: 0
    allow_hotwords: false

registry:
  allow_download: true
  catalog_url: ""               # empty → built-in catalog
  mirrors: []
  download_concurrency: 2
  strict_license: false         # true → refuse non-commercial weights

jobs:
  queue_size: 100
  max_concurrent: 0             # 0 → auto
  # A queued job owns its audio from the moment it is accepted until it
  # finishes, so the queue is bounded by bytes as well as by item count:
  # 100 slots at the 100 MB upload limit would otherwise be 10 GB of disk.
  # Exceeding it answers 429 with Retry-After; the synchronous path is
  # unaffected and keeps working.
  max_queued_bytes: 4294967296  # 4 GiB, must be at least max_upload_bytes
  max_processing_time: 30m
  history_ttl: 720h             # 30 days of metadata and transcripts
  # Signs webhook deliveries as X-NanoASR-Signature: sha256=<hmac> over
  # "<timestamp>.<body>". Empty means unsigned, and the server logs a warning.
  webhook_secret: ""
  # webhook_url is only ever dialled over https to a public address; a name
  # resolving to a private range is refused before any connection is made.
  # This turns that off, and is itself refused off loopback.
  webhook_allow_private: false

postproc:
  punctuation:
    enabled: false
    model: ""                   # a catalog model of kind punctuation
  itn:
    enabled: false
    locale: ru
  hotwords:
    enabled: false              # requires asr.variants.max > 0
    default_score: 1.5

diarization:
  enabled: false
  segmentation_model: pyannote-segmentation-3
  embedding_model: campplus-sv-voxceleb
  clustering:
    num_clusters: 0             # 0 → cluster by threshold
    # Lower separates more readily. 0.5 is sherpa-onnx's own default and merges
    # two voices of the same language and register; pass num_speakers on the
    # request whenever the count is known, it beats any threshold.
    threshold: 0.4
  # How short a turn may be before it is dropped, and how short a gap may be
  # before the turns around it are joined.
  min_duration_on: 0.3
  min_duration_off: 0.5

storage:
  db_path: /var/lib/nanoasr/nanoasr.db
  # Empty picks a nanoasr-spool directory under the system temp dir. Queued
  # audio lives here and nowhere else, and only until its job reaches a
  # terminal state; there is no setting that makes it stay (SPEC §2.1).
  temp_dir: ""

log:
  level: info
  format: json
