name: release

# Four artefacts per tag: Linux and Windows, each with and without the embedded
# web UI. The UI is a compile-time embed, so "without" is a separate binary
# rather than a flag — which is the whole reason this matrix exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  # Built once and shared: the same dist goes into both UI artefacts, so a
  # Linux and a Windows download are serving byte-identical assets.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ui: "1"
          - os: ubuntu-latest
            goos: linux
            ui: "0"
          - os: windows-latest
            goos: windows
            ui: "1"
          - os: windows-latest
            goos: windows
            ui: "0"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # cgo is not optional here — sherpa-onnx is C++ — so a runner without a
      # C compiler has to grow one before anything else happens.
      - name: ensure a C compiler
        if: matrix.goos == 'windows'
        run: |
          if ! command -v gcc >/dev/null; then
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"
          fi
      - name: compiler version
        run: gcc --version

      - uses: actions/download-artifact@v4
        if: matrix.ui == '1'
        with:
          name: web-dist
          path: internal/ui/dist

      - name: build the archive
        id: dist
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          UI: ${{ matrix.ui }}
        run: |
          # Assigned first and echoed second, on purpose: a failing command
          # substitution inside `echo "..."` leaves echo's exit status, so the
          # build could fail and the step still pass with an empty archive name.
          archive="$(./scripts/dist.sh)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # A release nobody can run is worse than no release. Unpack what was just
      # built and ask the binary what it is: the version has to be the tag, and
      # the ui line has to match the variant — the failure this catches is a UI
      # build that shipped the placeholder page, which looks fine until opened.
      - name: smoke test the archive
        run: |
          mkdir -p check
          case "${{ matrix.goos }}" in
            linux)   tar -xzf "${{ steps.dist.outputs.archive }}" -C check
                     bin=./nanoasr ;;
            # 7z rather than unzip: Git-bash on a Windows runner does not
            # necessarily carry unzip, and 7z is in the image.
            windows) 7z x -ocheck -bso0 -bsp0 "${{ steps.dist.outputs.archive }}"
                     bin=./nanoasr.exe ;;
          esac
          # Named rather than globbed: ./nanoasr* also matches nanoasr.yaml and
          # nanoasr.service, which would be passed to the binary as arguments.
          out="$(cd check && "$bin" version)"
          echo "$out"
          want_ui=$([ "${{ matrix.ui }}" = "1" ] && echo true || echo false)
          grep -q "ui *${want_ui}$" <<<"$out" || { echo "ui line is not ${want_ui}" >&2; exit 1; }
          grep -q "${{ inputs.tag || github.ref_name }}" <<<"$out" || { echo "version is not the tag" >&2; exit 1; }
          # The diarizer loads onnxruntime by bare name, relying on the loader
          # to hand back the copy sherpa-onnx already mapped. Hold it to that:
          # the same version, from the file this archive ships — on Windows,
          # not the older onnxruntime.dll that Windows 11 keeps in System32.
          ort="$(sed -n 's/^onnxruntime *//p' <<<"$out")"
          diar="$(grep '^diarizer ' <<<"$out")" || { echo "no diarizer line" >&2; exit 1; }
          read -r _ _ diar_ver diar_path <<<"$diar"
          [ "$diar_ver" = "$ort" ] || { echo "diarizer runs onnxruntime $diar_ver, sherpa-onnx $ort" >&2; exit 1; }
          case "${{ matrix.goos }}" in
            linux)   want='*/check/lib/libonnxruntime.so' ;;
            windows) want='*\\check\\onnxruntime.dll' ;;
          esac
          # shellcheck disable=SC2254
          case "$diar_path" in
            $want) ;;
            *) echo "diarizer loaded onnxruntime from $diar_path, not from the archive" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-ui${{ matrix.ui }}
          path: ${{ steps.dist.outputs.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts

      # The installers ship as release assets so that the one-liners in the
      # README always point at a script and the archives it knows how to
      # install: /releases/latest/download/install.sh resolves to whichever
      # release is current, and that script then installs exactly it.
      - name: stage the installers and the checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 scripts/install-gpu.sh artifacts/
          # Named rather than globbed so that sha256sums.txt cannot end up
          # listing itself, which is how a checksum file becomes unverifiable.
          (cd artifacts && sha256sum nanoasr-* install.sh install.ps1 install-gpu.sh \
            > sha256sums.txt)
          cat artifacts/sha256sums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=$(cat <<'EOF'
          ## Install

          Linux, as a systemd service. The CPU is the default; `--gpu` recognises on
          an NVIDIA device instead, and `--addr` decides where the server listens:

              # CPU, on 127.0.0.1:8080.
              curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash

              # NVIDIA GPU, CUDA 12 or 13 with cuDNN 9.
              curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash -s -- --gpu

              # A port of your own, reachable from other machines.
              curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash -s -- --addr 0.0.0.0:9000

              # Both.
              curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash -s -- --gpu --addr 0.0.0.0:9000

          Windows, as a service, in PowerShell. Installing on the GPU is Linux-only
          for now, and `iex` cannot pass arguments, so the address arrives as an
          environment variable:

              irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex

              $env:NANOASR_ADDR = "0.0.0.0:9000"; irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex

          Either one works out the release, verifies what it downloads against
          `sha256sums.txt`, writes a configuration with two API keys, downloads
          the models and leaves a running service behind. Run it again to
          upgrade; the configuration and the models are kept. `--uninstall`
          (`-Uninstall` in PowerShell) undoes it.

          Add `--realtime` (`-Realtime`) to also serve streaming recognition
          over a websocket at `/v1/realtime`, in the event protocol of OpenAI's
          realtime transcription API. It fetches a Russian streaming model;
          note that no streaming Russian model writes punctuation or capitals.

          `--gpu` works the same on a fresh installation and on one already running
          on the CPU, `--no-gpu` goes back, and an ordinary upgrade never changes
          which one you are on — it refreshes the GPU libraries of a GPU
          installation so they keep matching the binary.

          It swaps in the CUDA build of the sherpa-onnx libraries, points the
          service at them, and checks that they load before changing anything:
          a host that cannot serve the provider is left running on the CPU and
          told so. `nanoasr gpu` reports what the loaded libraries can do, and
          the server refuses to start on a provider it cannot serve rather than
          falling back to the CPU in silence. `install-gpu.sh` is that step on
          its own, with more options.

          ## Archives

          Four of them, all self-contained apart from ffmpeg and the model
          weights:

          | file | for |
          |---|---|
          | `nanoasr-<tag>-linux-amd64.tar.gz` | Linux, web UI included |
          | `nanoasr-<tag>-linux-amd64-noui.tar.gz` | Linux, headless |
          | `nanoasr-<tag>-windows-amd64.zip` | Windows, web UI included |
          | `nanoasr-<tag>-windows-amd64-noui.zip` | Windows, headless |

          The native libraries travel inside the archive, so unpack the whole
          thing rather than lifting the binary out: on Linux the RUNPATH points
          at `./lib`, and on Windows the loader looks beside the `.exe`.

          Then, in the unpacked directory:

              ./nanoasr init
              ./nanoasr serve -config nanoasr.yaml

          `init` writes the configuration, issues an admin and a user key and
          downloads the models. On Windows, `nanoasr.exe --install` registers
          the service. See README.md in the archive.
          EOF
          )
          # Idempotent on purpose: re-running the workflow for a tag replaces
          # the assets instead of failing on a release that already exists.
          #
          # The existence check asks for the release list rather than the release,
          # because a release written by hand before the tag is pushed is a draft,
          # and a draft is not reachable by its tag. Creating a second release for
          # a tag that already has a draft is the one outcome worth engineering
          # against: it would leave the written notes orphaned behind an empty
          # release. A draft is matched by tag_name and gets the assets, keeping
          # the title and the notes it was written with.
          # No pipe to head: the default shell runs with pipefail, and gh taking a
          # SIGPIPE from a reader that has already left would fail the step.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\") | .id] | first // empty")
          if [[ -n "$existing" ]]; then
            echo "release $TAG exists (id $existing), uploading assets to it"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes "$notes"
          fi
