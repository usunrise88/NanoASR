name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  go:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The sherpa-onnx module carries ~95 MB of prebuilt libraries; without
          # a cache every job re-downloads it.
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); exit 1; }
      - run: go test -race ./...
      - run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o dist/nanoasr ./cmd/nanoasr
      - name: smoke test
        run: ./dist/nanoasr version

  integration:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The catalog is ~600 MB and every entry is pinned by checksum, so the
      # cache key is the catalog itself: it invalidates exactly when a model
      # changes and never otherwise.
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('internal/registry/catalog.yaml') }}
      - run: ./scripts/fetch-dev-models.sh
      - run: ./scripts/fetch-testdata.sh
      - name: transcribe for real
        # No -run filter: the build tag already selects the integration tests,
        # and a name filter silently excluded every test added after it was
        # written — the whole M3 job suite never ran here.
        run: go test -tags integration ./... -v

      # The browser half. It needs the same weights and the same audio, so it
      # runs here rather than in the web job, which stays a few seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/ui/dist
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: serve the built UI
        run: |
          go build -o dist/nanoasr ./cmd/nanoasr
          # Two servers: one open, one demanding a key, because "the SPA asks
          # for a key when the server wants one" cannot be tested against a
          # server that does not.
          sed -e 's/^  mode: open/  mode: apikey/'               -e 's/^  keys: \[\].*/  keys: [{name: ui, key: sk-ci-key-0123456789}]/'               -e 's|^  addr: .*|  addr: "127.0.0.1:8081"|'               -e 's|^  db_path: .*|  db_path: ./.nanoasr-auth.db|'               configs/nanoasr.dev.yaml > /tmp/nanoasr-auth.yaml
          ./dist/nanoasr serve -config configs/nanoasr.dev.yaml &
          ./dist/nanoasr serve -config /tmp/nanoasr-auth.yaml &
          for i in $(seq 60); do
            if curl -sf localhost:8080/healthz >/dev/null && curl -sf localhost:8081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "servers did not come up" >&2
          exit 1
      - run: npm run test:e2e
        working-directory: web
        env:
          NANOASR_E2E_AUTH_URL: http://127.0.0.1:8081
          NANOASR_E2E_KEY: sk-ci-key-0123456789
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: web/test-results

  docker:
    runs-on: ubuntu-latest
    needs: [web, go]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
