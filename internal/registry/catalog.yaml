      size_bytes: 6958444
    license: mit
    commercial_use: "yes"
    notes: >-
      Speaker-agnostic: it finds turn boundaries, and the embedding model below
      decides which turns belong to the same person.

  # ---------------------------------------------------------------------------
  # Diarization, part two: speaker embeddings. Not an archive, one .onnx file.
  #
  # Trained on Chinese and English, and used here for Russian on purpose: a
  # speaker embedding is voice timbre rather than language, and the clustering
  # only ever compares embeddings with each other.
  - id: campplus-sv-zh-en
    revision: "16k-common-advanced"
    kind: embedding
    family: campplus
    display_name: CAM++ speaker embedding (zh/en)
    languages: [multi]
    sample_rate: 16000
    files:
      model: 3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
    resources:
