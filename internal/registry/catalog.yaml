# Built-in model catalog.
#
# Every entry is verified before it lands here: downloaded, run through
# `nanoasr models inspect --probe`, and transcribed once to confirm the result
# is language rather than noise. Nothing in this file is inferred from a model
# name, and every checksum is the one measured from the artefact.
#
# commercial_use is stated by whoever added the entry after reading the licence.
# It is never guessed from a licence string: registry.strict_license refuses
# anything that is not a positive "yes", so an honest "unknown" is the point of
# the field rather than a gap in it.
#
# v1 families (SPEC decision #8): transducer, zipformer_ctc, nemo_ctc,
# wenet_ctc, telespeech. Multilingual coverage comes from many monolingual
# models here rather than from one multilingual model (SPEC §3.1).
version: 1

models:
  # ---------------------------------------------------------------------------
  # Russian, CTC. The reference model for the telephony workload: cheapest on
  # CPU of the three, character vocabulary, token timestamps but no log
  # probabilities — so words carry no confidence.
  - id: gigaam-v2-ctc-ru
    revision: "2025-04-19"
    kind: asr
    family: nemo_ctc
    display_name: GigaAM v2 CTC (Russian)
    languages: [ru]
    sample_rate: 16000
    modeling_unit: char
    files:
      model: model.int8.onnx
      tokens: tokens.txt
    features:
      sample_rate: 16000
      dim: 64
    runtime:
      decoding_method: greedy_search
    resources:
      approx_rss_mb: 900
    source:
      url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-ctc-giga-am-v2-russian-2025-04-19.tar.bz2
      sha256: 777be8717d8aaf04861823671290f7687f7579fd9ac63a2124955573f920caf5
      size_bytes: 166917722
    license: https://github.com/salute-developers/GigaAM/blob/main/LICENSE
    # The LICENSE file shipped inside the archive is a saved GitHub HTML page,
    # not a licence text — the release script fetched the blob URL instead of
    # the raw one. The terms therefore cannot be established from the download,
    # and this stays "unknown" until someone reads the real licence.
    commercial_use: unknown
    notes: >-
      Character-level Russian CTC, trained at 16 kHz. Measured: this model
      derives its own feature dimension and ignores features.dim entirely.

  # ---------------------------------------------------------------------------
  # Russian, CTC, punctuating. The default model: it writes sentence marks and
  # capitals itself, which is the only way Russian gets punctuation at all —
  # sherpa-onnx publishes a CT-Transformer punctuation model for Chinese and
  # English and none for Russian (SPEC §5.6).
  #
  # Punctuation is not declared here. It is read from tokens.txt at load time,
  # because the family cannot say it — v2 below is the same family and does not
  # punctuate — and a manifest that claimed it would be a claim nobody checked.
  - id: gigaam-v3-ctc-punct-ru
    revision: "2025-12-16"
    kind: asr
    family: nemo_ctc
    display_name: GigaAM v3 CTC punct (Russian)
    languages: [ru]
    sample_rate: 16000
    modeling_unit: bpe
    files:
      model: model.int8.onnx
      tokens: tokens.txt
    features:
      sample_rate: 16000
      dim: 64
    runtime:
      decoding_method: greedy_search
    resources:
      approx_rss_mb: 900
    source:
      url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-ctc-punct-giga-am-v3-russian-2025-12-16.tar.bz2
      sha256: 20e41e160efa6f2460a7ef6554cdbbb9e8fffb2b92e6bc708e9406bd8b9256ea
      size_bytes: 163282594
    license: https://github.com/salute-developers/GigaAM/blob/main/LICENSE
    # Same as v2: the archive ships a saved GitHub HTML page in place of the
    # licence text, so the terms cannot be established from the download.
    commercial_use: unknown
    notes: >-
      Subword vocabulary of 257 tokens carrying full stops, commas, question
      marks and capitals — hence punctuation and casing without a second pass.
      Like v2 it derives its own feature dimension and ignores features.dim.
      Measured on the reference clip: correct on both 8 kHz telephony variants,
      but on the 16 kHz original it fuses two words across one VAD boundary
      ("Лукоморьядууб"). The transducer entry below does not. Telephony is the
      workload this model is the default for, and it is the cheaper of the two
      on CPU, so the artefact is recorded rather than traded for the cost.

  # ---------------------------------------------------------------------------
