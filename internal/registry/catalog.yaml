  # ---------------------------------------------------------------------------
  # English, transducer, SentencePiece. Small enough for CI, and the only entry
  # with a BPE vocabulary — the branch of word assembly the Russian models never
  # exercise.
  - id: zipformer-small-en
    revision: "2023-06-26"
    kind: asr
    family: transducer
    display_name: Zipformer small (English)
    languages: [en]
    sample_rate: 16000
    modeling_unit: bpe
    files:
      encoder: encoder-epoch-99-avg-1.int8.onnx
      decoder: decoder-epoch-99-avg-1.int8.onnx
      joiner: joiner-epoch-99-avg-1.int8.onnx
      tokens: tokens.txt
    features:
      sample_rate: 16000
      # Measured, and not optional here: this model declares a fixed input
      # shape, and onnxruntime answers a mismatch by throwing a C++ exception
      # that terminates the process. 64 does not transcribe badly, it aborts.
      dim: 80
    runtime:
      decoding_method: greedy_search
    resources:
      approx_rss_mb: 600
    source:
      url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-small-en-2023-06-26.tar.bz2
      sha256: c8bff1091c26c49731cddbcd60ef18061142ea11523df1b73bf1b14451b9c15e
      size_bytes: 112232184
    license: apache-2.0
    commercial_use: "yes"

